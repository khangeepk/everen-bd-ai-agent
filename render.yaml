# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Why Render: it builds the repo's own Dockerfile directly (no separate
# buildpack config to maintain), its managed Postgres includes pgvector
# support and automated daily backups with point-in-time recovery on paid
# plans (the "Basic" tier below, ~$6-8/mo, is the cheapest tier that
# includes them -- the free Postgres tier does not), and pricing is flat and
# predictable rather than usage-metered, which matters more for a low-QPS
# internal BD tool than raw scale headroom. See DEPLOYMENT.md for the
# one-time manual setup (Render account, connecting this repo, filling in
# `sync: false` secrets in the dashboard).
#
# This file only describes infrastructure shape. It does not create the
# Render account, connect the GitHub repo, or populate secret values --
# those steps require a human with dashboard access and cannot be done by an
# agent on your behalf.

databases:
  - name: everen-db
    plan: basic-256mb # cheapest plan that includes daily automated backups
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only; no public internet access to the DB

services:
  - type: redis
    name: everen-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: everen-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: false # deploys are triggered explicitly by CI/CD (see ci-cd.yml) after tests pass, not on every push
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: everen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: everen-redis
          property: connectionString
      # --- Secrets: generated by Render, never checked into this repo ---
      - key: SECRET_KEY
        generateValue: true
      # --- Secrets: must be filled in manually in the Render dashboard.
      # `sync: false` tells Render "this var exists, but its value is not
      # managed by the blueprint" -- it will prompt for a value on first
      # deploy and preserve it across future blueprint syncs. See
      # DEPLOYMENT.md for the full list and where each value comes from.
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: OUTREACH_FROM_EMAIL
        sync: false
      - key: OUTREACH_PHYSICAL_ADDRESS
        sync: false
      - key: OUTREACH_PUBLIC_BASE_URL
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
