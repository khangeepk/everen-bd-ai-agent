[project]
name = "everen-bd-agent-backend"
version = "0.1.0"
description = "Everen BD Agent - FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app/services", "app/agents", "app/core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the rules that catch real bugs (E errors, F pyflakes, I import order,
# UP pyupgrade, B bugbear). Ignore style-only families that have zero runtime
# impact: D (pydocstyle), E501 (line length), W292 (missing final newline).
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D", "E501", "W292"]

[tool.ruff.lint.pydocstyle]
convention = "google"
